ext {
    awsEncryptionSdkVersion = "2.4.0"
}

dependencies {
    implementation("com.amazonaws:aws-encryption-sdk-java:$awsEncryptionSdkVersion") {
        exclude group: "org.bouncycastle"
    }

    testImplementation "org.bouncycastle:bc-fips:2.1.2"
    testImplementation project(":crypto-provider")
}

tasks.register("testWithBcFips", Test) {
    description = "Runs the tests with BouncyCastleFipsProvider registered as the first JCE provider."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    minHeapSize = "1024m"
    maxHeapSize = "1024m"
    systemProperty "aiven.crypto.test.bcfips", "true"
}

tasks.named("check") {
    dependsOn "testWithBcFips"
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = getGroup()
            artifactId = getName()
            version = getVersion()

            pom {
                name = "Aiven AWS Encryption SDK message format cipher for OpenSearch repository encryption"
                description = "Aiven AWS Encryption SDK message format cipher for OpenSearch repository encryption"
                url = "https://aiven.io"
                organization {
                    name = "Aiven Oy"
                    url = "https://aiven.io"
                }
                licenses {
                    license {
                        name = "Apache License 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.html"
                        distribution = "repo"
                    }
                }
                scm {
                    connection = "scm:git:git@github.com:aiven/aiven-elasticsearch-repositories.git"
                    developerConnection = "scm:git:git@github.com:aiven/aiven-elasticsearch-repositories.git"
                    url = "https://github.com/aiven/aiven-elasticsearch-repositories.git"
                    tag = "HEAD"
                }
            }
        }
    }
}
