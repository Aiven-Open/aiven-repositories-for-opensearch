publishing {
    publications {
        maven(MavenPublication) {
            groupId = getGroup()
            artifactId = getName()
            version = getVersion()

            pom {
                name = "Aiven RSA key provider for OpenSearch repository encryption"
                description = "Aiven RSA key provider for OpenSearch repository encryption"
                url = "https://aiven.io"
                organization {
                    name = "Aiven Oy"
                    url = "https://aiven.io"
                }
                licenses {
                    license {
                        name = "Apache License 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.html"
                        distribution = "repo"
                    }
                }
                scm {
                    connection = "scm:git:git@github.com:aiven/aiven-elasticsearch-repositories.git"
                    developerConnection = "scm:git:git@github.com:aiven/aiven-elasticsearch-repositories.git"
                    url = "https://github.com/aiven/aiven-elasticsearch-repositories.git"
                    tag = "HEAD"
                }
            }
        }
    }
}
